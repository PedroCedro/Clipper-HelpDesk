# Nome da aplicação
spring.application.name=clipper

# Configuração do CORS em DEVELOPMENT
app.cors.allowed-origin=http://localhost:5173

# Banco de desenvolvimento: H2 em arquivo, imitando PostgreSQL.
# Ponte até o Postgres real (ver dívida do Flyway no DebitoTecnico.local).
spring.datasource.url=jdbc:h2:file:./data/clipper;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate cria/atualiza o schema sozinho enquanto o modelo ainda muda.
spring.jpa.hibernate.ddl-auto=update

# Exibe SQL no console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Console web para inspecionar o banco em http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Motor de IA — MVP: provider OpenAI-compatível, GPT-4o-mini.
# A chave é server-side e vem da variável de ambiente OPENAI_API_KEY (nunca versionada).
# Para trocar por Groq/DeepSeek/Ollama, basta mudar base-url + model + a chave.
#
# provider seleciona qual bean de IA fica ativo: "openai" (OpenAiCompatibleProvider,
# default) ou "claude" (ClaudeProvider, SDK Java da Anthropic). Só um por vez.
clipper.ai.provider=openai
clipper.ai.base-url=https://openrouter.ai/api/v1
clipper.ai.model=openai/gpt-4o-mini
clipper.ai.api-key=${OPENAI_API_KEY:}

# Coletor TOTVS Winthor. Fica desligado por padrao e roda somente quando a flag
# enabled for passada na linha de comando.
clipper.collector.totvs-winthor.enabled=false
clipper.collector.totvs-winthor.locale=pt-br
clipper.collector.totvs-winthor.root-section-id=1500000596481
clipper.collector.totvs-winthor.root-section-name=Linha Winthor
clipper.collector.totvs-winthor.output-dir=src/main/java/br/com/infocedro/clipper/collector
clipper.collector.totvs-winthor.database-enabled=true
clipper.collector.totvs-winthor.database-path=src/main/java/br/com/infocedro/clipper/collector/totvs-winthor
clipper.collector.totvs-winthor.per-page=100
clipper.collector.totvs-winthor.request-delay-millis=250
