# Nome da aplicação
spring.application.name=clipper

# Configuração do CORS em DEVELOPMENT
app.cors.allowed-origin=http://localhost:5173

# Banco de desenvolvimento: H2 em arquivo, imitando PostgreSQL.
# Ponte ate o Postgres real (ver divida do Flyway no DebitoTecnico.local).
spring.datasource.url=jdbc:h2:file:./data/clipper;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate cria/atualiza o schema sozinho enquanto o modelo ainda muda.
spring.jpa.hibernate.ddl-auto=update

# Exibe SQL no console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Console web para inspecionar o banco em http://localhost:8080/h2-console
spring.h2.console.enabled=true
